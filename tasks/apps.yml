- name: Install core apps via brew casks
  community.general.homebrew_cask:
    name: "{{ item }}"
  ignore_errors: yes
  with_items:
    - 1password
    - android-sdk
    - android-studio
    - alfred
    - docker
    - surfshark
    - figma
    - gitify
    - lens
    - canva
    - google-chrome
    - google-cloud-sdk
    - licecap
    - ngrok
    - slack
    - raindropio
    - whatsapp
    - openvpn-connect
    - shottr
    - insomnia
    - kitty
    - kubernetic
    - visual-studio-code
    - zoom
    - webstorm
    - intellij-idea
    - sublime-text
    - rectangle
    - chatgpt
  tags: apps
